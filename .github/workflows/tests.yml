name: Tests

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:${{ matrix.qgis-image-tags }}
    strategy:
      matrix:
        # When making changes here remember to update the tag also in line 34!
        qgis-image-tags: ["3.40", "3.44", "4.0-questing", latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: uv venv --system-site-packages .venv
      - run: uv sync
      - run: .venv/bin/python -m pytest -v --cov=pickLayer --cov-report=xml test
        env:
          QT_QPA_PLATFORM: offscreen
      # Upload coverage report. Will not work if the repo is private
      # Remember to check that tag specified below can be found in the matrix created at line 16!
      - if: ${{ matrix.qgis_image_tags == '3.44' && !github.event.repository.private }}
        uses: codecov/codecov-action@29386c70ef20e286228c72b668a06fd0e8399192 # v1.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: false
        env:
          QT_QPA_PLATFORM: offscreen

  windows_tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - uses: crazy-max/ghaction-chocolatey@e80bd39bb49cae70b67ea53d52d00833a7255c21 # v1.7.0
        with:
          args: install qgis-ltr -y
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - shell: pwsh
        run: |
          uv export --group dev --no-emit-project -o requirements-ci.txt
          $env:QGIS_PATH = (Get-ChildItem "C:\Program Files\QGIS *\bin" | Select-Object -First 1 -ExpandProperty FullName)
          $env:PATH="$env:QGIS_PATH;$env:PATH"
          $env:QGIS_PLUGIN_IN_CI=1
          python-qgis-ltr.bat -m pip install -q -r requirements-ci.txt --no-deps --only-binary=:all:
          python-qgis-ltr.bat -m pip install -e . --no-deps
          python-qgis-ltr.bat -m pytest -v test

  plugin_zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.10'
      # Use --no-editable so .dist-info is written to site-packages instead of .egg-info
      - run: uv sync --no-editable
      - run: uv run qgis-plugin-dev-tools build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-zip
          path: dist/*.zip
